<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaces de un Electrodoméstico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: #1a202c;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            .container {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Interfaces de un Electrodoméstico</h1>
    </header>

    <main class="container">
        <div class="image-wrapper">
            <img src="Gemini_Generated_Image_6x55oi6x55oi6x55.png" alt="Ficha técnica de interfaces del hervidor eléctrico">
        </div>
    </main>

</body>
</html>
